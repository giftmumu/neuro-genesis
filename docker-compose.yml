version: '3.8'
services:
  openclaw:
    image: ghcr.io/giftmumu/openclaw:stable
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - /mnt/f/OpenClaw_Memory/logs:/app/logs
    environment:
      - NODE_ENV=production
      - OPENCLAW_MODE=local
      - TZ=Asia/Shanghai
    networks:
      - neuro-net

  emotion-engine:
    image: ghcr.io/giftmumu/emotion-engine:stable
    container_name: emotion-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - /mnt/f/OpenClaw_Memory/models/bert:/root/.cache/huggingface
    environment:
      - VISUAL_URL=http://visual-server:8080
    networks:
      - neuro-net

  visual-server:
    image: ghcr.io/giftmumu/node--22--bookworm
    container_name: visual-server
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install && node server.js"
    volumes:
      - ./services/visual-server:/app
    ports:
      - "8088:8080"
    networks:
      - neuro-net

  ollama:
    image: ghcr.io/giftmumu/ollama-ollama--latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - /mnt/f/OpenClaw_Memory/models/ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - neuro-net

  prometheus:
    image: ghcr.io/giftmumu/prom-prometheus--latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - neuro-net

  grafana:
    image: ghcr.io/giftmumu/grafana-grafana--latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - neuro-net

networks:
  neuro-net:
    driver: bridge
