# =====================================================================
# NEURO-GENESIS 官方 6 月最新版分布式网关专属拓扑清单
# =====================================================================
version: "1.0"

gateway:
  mode: local
  bind: 0.0.0.0
  port: 18789

# 强制开启 Web 路由代理，将 3000 端口的流量内部无感打通
web:
  enabled: true
  port: 3000
  bind: 0.0.0.0

# 微服务集群高内聚路由映射（全量对齐你的业务形态）
routes:
  - path: /api/v1/ollama
    target: http://ollama:11434
  - path: /api/v1/emotion
    target: http://emotion-engine:8001
  - path: /api/v1/visual
    target: http://visual-server:8080

auth:
  enabled: false # 强行关闭云端集中式鉴权，允许本地及付费生态 100% 裸奔通行
