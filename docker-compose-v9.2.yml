# =====================================================================
# NEURO-GENESIS 基础设施层标准化协议 (v9.2 平台工程级全解耦算力发现网格)
# =====================================================================
#
# v9.2 增量 (相对 v9.1):
#   [FIX]  $$PORT → $PORT (Compose command 块中 $ 无需转义)
#   [FIX]  healthcheck interval 10s → 30s (减少高负载下误报)
#   [FIX]  healthcheck start_period 45s → 90s (给 privoxy + 首次探测更多缓冲)
#   [FIX]  healthcheck timeout 5s → 10s (与 start_period 匹配)
#   [FIX]  healthcheck retries 10 → 5 (降低过度重试开销)
#   [CHANGE] OpenClaw 直连 CC-Switch, 移除 HTTP_PROXY / OPENCLAW_LLM_ENDPOINT / depends_on
#
# 架构角色声明 (经 DeepSeek API / CC-Switch GitHub README / Claude Code / OpenClaw
#                 四大官方文档交叉核实 v2026-06):
#
#   Claude Code (Anthropic Messages) → CC-Switch :15721 → DeepSeek (Anthropic / OpenAI)
#   OpenClaw Gateway → host.docker.internal:15721 → CC-Switch (Codex 路由) → DeepSeek
#   emotion-engine / visual-server / ollama → Privoxy (network-guardian) → host.docker.internal:TARGET_PORT
#
#   CC-Switch 不是 HTTP outbound proxy，是本地路由 + 协议转换网关
#   CC-Switch 端点: /v1/messages (Anthropic) + /v1/chat/completions (OpenAI)
#   DeepSeek API: 兼容 OpenAI + Anthropic 双协议格式
# =====================================================================

x-common-hosts: &common-hosts
  # extra_hosts intentionally removed.
  # Docker Desktop for Windows provides built-in host.docker.internal DNS
  # that correctly resolves to the Windows host.
  # Overriding with host-gateway breaks CC-Switch / Clash port access.
  dns: []

# 极致美学：业务服务全量挂载代理出口，确保存量组件无感进化
x-proxy-env: &proxy-env
  HTTP_PROXY: "http://docker.internal:80"
  HTTPS_PROXY: "http://docker.internal:80"
  http_proxy: "http://docker.internal:80"
  https_proxy: "http://docker.internal:80"
  # v9.1 FIX (保留): 追加 docker.internal (network-guardian 容器自身别名)
  # 上下文: 所有业务容器的 HTTP_PROXY 指向 docker.internal:80 (network-guardian)。
  #  如果业务容器内部请求也需要访问 docker.internal (如 healthcheck 回调)，
  # 不在 NO_PROXY 中的话会形成 代理自环: docker.internal → HTTP_PROXY → docker.internal
  NO_PROXY: "localhost,127.0.0.1,0.0.0.0,openclaw-gateway,openclaw-frontend,emotion-engine,visual-server,ollama,prometheus,grafana,.local,.internal,neuro-net,host.docker.internal,docker.internal"

services:

  # NETWORK GUARDIAN: 核心网络自举内核 (零代理依赖、多模态自愈、动态算力发现)
  network-guardian:
    image: alpine:3.20
    container_name: network-guardian
    restart: unless-stopped
    <<: *common-hosts
    # 斩断衔灭死锁：完全剥离全局代理污染，确保容器在完全清净的真实网域下 100% 自举成功
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
    networks:
      neuro-net:
        aliases:
          - docker.internal
    # 工业级四层纯净存活探针：只检测本地 80 端口的 TCP 活性，绝不绑架外网，
    # 在极端断网下提供最高内网鲁棒性
    # v9.2 FIX: interval 10s → 30s，减少高负载下不必要的探测开销与误报
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # 平台工程级防御性控制脚本：配置即事件、动态发现、自动降级
    command: |
      sh -c '
        set -e
        echo "[BOOTSTRAP] Initializing autonomous L4/L7 mesh network..."
        until apk add --no-cache privoxy curl iputils; do 
          echo "[RETRY] Package registry unreachable, backing off..."; sleep 3; 
        done
        
        # 灌入幂等基础策略事实源
        echo "listen-address 0.0.0.0:80" > /etc/privoxy/config
        echo "toggle 1" >> /etc/privoxy/config
        echo "enable-remote-toggle 0" >> /etc/privoxy/config
        echo "enable-remote-http-toggle 0" >> /etc/privoxy/config
        echo "enable-edit-actions 0" >> /etc/privoxy/config
        echo "forward / ." >> /etc/privoxy/config
        privoxy --no-daemon /etc/privoxy/config &
        
        set +e
        CURRENT_PORT=0
        while true; do
          TARGET_PORT=0
          
          # 核心防御性动态发现：自动按照优先级扫描宿主机存活的算力或梯子通道
          # 保持与 global-infra-v16.6.2.yaml infra_network.probe_ports 同步
          # 架构说明:
          #   15721/4386 = CC-Switch 本地路由 (Anthropic↔OpenAI 协议翻译网关)
          #   7890/10809 = Clash 混合代理 (直连出海通道，无协议翻译)
          #   7893/2334 = 特种网关
          #   Claude Code/OpenClaw 的流量经 Privoxy 劫持到此端口
          #   CC-Switch 收到请求后按"供应商卡片"路由到 DeepSeek/Claude 等
          #   DeepSeek API: https://api.deepseek.com (国内直连, OpenAI 兼容)
          for PORT in 15721 4386 7890 10809 7893 2334; do
            if nc -z -w 1 host.docker.internal $$PORT > /dev/null 2>&1; then
              TARGET_PORT=$$PORT
              break
            fi
          done

          # 拓扑状态机幂等动态变更
          if [ $$TARGET_PORT -ne $$CURRENT_PORT ]; then
            echo "[SHIFT] Upstream portal shifted from $$CURRENT_PORT to $$TARGET_PORT. Re-wiring ambient mesh..."
            sed -i "/forward /d" /etc/privoxy/config
            
            if [ $$TARGET_PORT -ne 0 ]; then
              echo "forward / host.docker.internal:$$TARGET_PORT" >> /etc/privoxy/config
              echo "[SUCCESS] Dynamic mesh attached to active port $$TARGET_PORT"
            else
              echo "forward / ." >> /etc/privoxy/config
              echo "[FALLBACK] Clean Direct Mode Activated. Infrastructure Secured."
            fi
            
            # 原子级退避：2秒安全缓冲，确保内核套接字端口 100% 腾退干净，防止进程内讧假死
            pkill -F /var/run/privoxy.pid || pkill privoxy || true
            sleep 2
            privoxy --no-daemon /etc/privoxy/config &
            CURRENT_PORT=$$TARGET_PORT
          fi
          
          sleep 15
        done
      '

  # [分布式解耦层 - 核心API网关]
  # 架构位置: 最顶层业务网关。使用 host 网络直连 WSL2 本机的 CC-Switch (127.0.0.1:15721)
  #   数据流: OpenClaw → 127.0.0.1:15721/v1/chat/completions
  #           → CC-Switch 双协议网关 → api.deepseek.com/v1/chat/completions
  #   使用 host 网络而非 bridge（neuro-net）的原因:
  #     Docker Desktop WSL2 后端的 host.docker.internal 在 HTTP 层有连接重置 bug
  #     host 网络模式让容器共享 WSL2 网络栈，127.0.0.1 直连 CC-Switch
  #   不在 HTTP_PROXY 链中 — LLM API 请求直接发给 CC-Switch，不走 Privoxy
  openclaw-gateway:
    image: ghcr.io/giftmumu/openclaw:stable
    container_name: openclaw-gateway
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./config:/app/config
      - /mnt/f/OpenClaw_Memory/logs:/app/logs
    environment:
      # 不设 HTTP_PROXY — 直连 CC-Switch，不需要经过 Privoxy 透明代理
      NODE_ENV: production
      OPENCLAW_MODE: gateway
      OPENCLAW_STATE_DIR: /app/config
      OPENCLAW_GATEWAY_TOKEN: bypass
      OPENCLAW_GATEWAY_PASSWORD: bypass


  # ========== 存量业务微服务层 (资产完美保留) ==========
  emotion-engine:
    image: ghcr.io/giftmumu/emotion-engine:stable
    container_name: emotion-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - /mnt/f/OpenClaw_Memory/models/bert:/root/.cache/huggingface
    environment:
      <<: *proxy-env
      VISUAL_URL: http://visual-server:8080
    <<: *common-hosts
    networks:
      neuro-net: {}
    depends_on:
      network-guardian:
        condition: service_healthy

  visual-server:
    image: ghcr.io/giftmumu/visual-server:stable
    container_name: visual-server
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      <<: *proxy-env
    <<: *common-hosts
    networks:
      neuro-net: {}
    depends_on:
      network-guardian:
        condition: service_healthy

  ollama:
    image: ghcr.io/giftmumu/ollama-ollama--latest:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/f/OpenClaw_Memory/models/ollama:/root/.ollama
    environment:
      <<: *proxy-env
      OLLAMA_HOST: 0.0.0.0:11434
    <<: *common-hosts
    networks:
      neuro-net: {}
    depends_on:
      network-guardian:
        condition: service_healthy

  prometheus:
    image: ghcr.io/giftmumu/prom-prometheus--latest:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      <<: *proxy-env
    <<: *common-hosts
    networks:
      neuro-net: {}
    depends_on:
      network-guardian:
        condition: service_healthy

  grafana:
    image: ghcr.io/giftmumu/grafana-grafana--latest:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      <<: *proxy-env
    <<: *common-hosts
    networks:
      neuro-net: {}
    depends_on:
      network-guardian:
        condition: service_healthy

networks:
  neuro-net:
    name: openclaw_genesis_neuro-net
    driver: bridge