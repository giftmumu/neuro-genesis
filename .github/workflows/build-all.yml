name: NEURO-GENESIS Production Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签'
        required: false
        default: 'stable'
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 2026-08-16: Docker Hub 双推开关（secrets 不允许直接用于 if:，改用 job 级 env 传递）
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      # ========== 0. 清理磁盘 ==========
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set version tag
        run: echo "VERSION_TAG=${{ github.event.inputs.version || 'stable' }}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2026-08-16: Docker Hub 双推（需仓库配置 DOCKERHUB_USERNAME/TOKEN secrets，未配置则跳过）
      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========== 1. emotion-engine ==========
      - name: Build & push emotion-engine
        uses: docker/build-push-action@v6
        with:
          context: ./services/emotion
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emotion-engine:${{ env.VERSION_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine,mode=max

      # 2026-08-16: GHCR 构建产物无损复制到 Docker Hub（免重构建）
      - name: Mirror emotion-engine to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/emotion-engine:${{ env.VERSION_TAG }}" \
            "ghcr.io/${{ github.repository_owner }}/emotion-engine:${{ env.VERSION_TAG }}"

      # ========== 2. visual-server ==========
      # 预检：确保 ghcr.io 包可写（避免手动推送造成的 403）
      - name: Ensure ghcr.io package accessibility
        run: |
          PKG="visual-server"
          echo ">>> 检查包 $PKG 是否存在..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user/packages/container/$PKG" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "包已存在，尝试设为公开..."
            curl -s -X PATCH \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/user/packages/container/$PKG" \
              -d '{"visibility":"public"}' || true
            echo "包可见性已更新"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "无法查询（网络或认证），继续构建..."
          else
            echo "包状态码=$HTTP_CODE，继续构建，将由 Actions 自动创建..."
          fi

      - name: Build & push visual-server
        uses: docker/build-push-action@v6
        with:
          context: ./services/visual-server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/visual-server:${{ env.VERSION_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:visual-server
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:visual-server,mode=max

      # ========== 3. openclaw ==========
      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          path: openclaw-src
          ref: main

      - name: Patch OpenClaw Dockerfile
        run: sed -i 's/--config.offline=true//g' openclaw-src/Dockerfile

      - name: Build & push OpenClaw
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw-src
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openclaw:${{ env.VERSION_TAG }}
          build-args: NODE_OPTIONS=--max_old_space_size=4096
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw,mode=max

      # ========== 4. 基础镜像标准化中转 (核心修复) ==========
      - name: Sync base images (Standardized Naming)
        run: |
          images=(
            "node:22-bookworm"
            "python:3.11-slim"
            "ollama/ollama:latest"
            "prom/prometheus:latest"
            "grafana/grafana:latest"
            "alpine:3.20"
          )
          
          for img in "${images[@]}"; do
            # 【关键算法】
            # 规则：/ 替换为 - (单横杠)
            # 规则：: 替换为 -- (双横杠)
            # 结果：node:22-bookworm -> node--22-bookworm
            safe_name=$(echo "$img" | sed 's/\//-/g; s/:/--/g')
            
            target="ghcr.io/${{ github.repository_owner }}/$safe_name"
            
            echo ">>> 同步: $img -> $target:latest"
            
            # 无损同步并强制打 latest 标签
            docker buildx imagetools create --tag "$target:latest" "$img"
            
            # 自动公开
            curl -s -X PATCH \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/packages/container/$safe_name \
              -d '{"visibility":"public"}' || true
          done