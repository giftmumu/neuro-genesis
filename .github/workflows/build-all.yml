name: NEURO-GENESIS Official Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签'
        required: false
        default: 'stable'
      build_platform:
        description: '构建平台'
        required: false
        default: 'linux/amd64'
  push:
    branches: [ main ]

# 修复 Node.js 警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set version tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION_TAG=stable" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========== 1. emotion-engine ==========
      - name: Build & push emotion-engine
        uses: docker/build-push-action@v5
        with:
          context: ./services/emotion
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emotion-engine:${{ env.VERSION_TAG }}
          platforms: ${{ github.event.inputs.build_platform }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine,mode=max

      # ========== 2. openclaw (使用 main 分支 + 自动修补) ==========
      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          path: openclaw-src
          # 【修复】改回 main 分支，确保 Git 检出成功
          ref: main

      - name: Patch OpenClaw Dockerfile
        run: |
          echo ">>> 正在修补 Dockerfile..."
          sed -i 's/--config.offline=true//g' openclaw-src/Dockerfile
          if grep -q "config.offline" openclaw-src/Dockerfile; then
            echo "❌ 补丁失败"; exit 1
          fi
          echo "✅ 补丁成功"

      - name: Build & push OpenClaw
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw-src
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openclaw:${{ env.VERSION_TAG }}
          build-args: NODE_OPTIONS=--max_old_space_size=4096
          platforms: ${{ github.event.inputs.build_platform }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw,mode=max

      # ========== 3. 基础镜像中转 ==========
      - name: Transfer base images & Generate list
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/openclaw:${{ env.VERSION_TAG }}" > image-list.txt
          echo "ghcr.io/${{ github.repository_owner }}/emotion-engine:${{ env.VERSION_TAG }}" >> image-list.txt
          
          images=(
            "node:22-bookworm"
            "python:3.11-slim"
            "ollama/ollama:latest"
            "prom/prometheus:latest"
            "grafana/grafana:latest"
          )
          
          for img in "${images[@]}"; do
            for i in {1..3}; do docker pull "$img" && break || sleep 10; done
            safe_name=$(echo "$img" | sed 's/\//-/g;s/:/--/g')
            new_tag="ghcr.io/${{ github.repository_owner }}/$safe_name"
            docker tag "$img" "$new_tag"
            for i in {1..3}; do docker push "$new_tag" && break || sleep 10; done
            echo "$new_tag" >> image-list.txt
          done

      # ========== 4. 导出离线包 ==========
      - name: Verify and Pull all images
        run: while read img; do docker pull "$img"; done < image-list.txt

      - name: Export offline package & MD5
        run: |
          IMAGE_STRING=$(cat image-list.txt | tr '\n' ' ')
          docker save $IMAGE_STRING -o neuro-genesis-full.tar
          gzip neuro-genesis-full.tar
          md5sum neuro-genesis-full.tar.gz > neuro-genesis-full.tar.gz.md5
          gzip -t neuro-genesis-full.tar.gz && echo "✅ 校验通过"

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}-${{ github.sha }}
          name: "NEURO-GENESIS ${{ env.VERSION_TAG }}"
          files: |
            neuro-genesis-full.tar.gz
            neuro-genesis-full.tar.gz.md5

      - name: Cleanup
        run: rm -rf image-list.txt neuro-genesis-full.tar.gz*