name: NEURO-GENESIS Production Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签'
        required: false
        default: 'stable'
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # ========== 0. 磁盘空间释放 (防止 No space left on device) ==========
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set version tag
        run: echo "VERSION_TAG=${{ github.event.inputs.version || 'stable' }}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========== 1. 构建 Emotion Engine ==========
      - name: Build & push emotion-engine
        uses: docker/build-push-action@v5
        with:
          context: ./services/emotion
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emotion-engine:${{ env.VERSION_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine,mode=max

      # ========== 2. 构建 OpenClaw ==========
      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          path: openclaw-src
          ref: main

      - name: Patch OpenClaw Dockerfile
        run: sed -i 's/--config.offline=true//g' openclaw-src/Dockerfile

      - name: Build & push OpenClaw
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw-src
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openclaw:${{ env.VERSION_TAG }}
          build-args: NODE_OPTIONS=--max_old_space_size=4096
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw,mode=max

      # ========== 3. 基础镜像无损中转 (零磁盘占用) ==========
      - name: Sync base images (manifest copy)
        run: |
          images=(
            "node:22-bookworm"
            "python:3.11-slim"
            "ollama/ollama:latest"
            "prom/prometheus:latest"
            "grafana/grafana:latest"
          )
          for img in "${images[@]}"; do
            safe_name=$(echo "$img" | sed 's/\//-/g;s/:/--/g')
            target="ghcr.io/${{ github.repository_owner }}/$safe_name"
            echo "Syncing $img -> $target (No disk usage)"
            docker buildx imagetools create --tag "$target:latest" "$img"
          done

      # ========== 4. 自动权限治理 ==========
      - name: Set packages visibility to Public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          packages=(
            "emotion-engine" "openclaw" 
            "node--22--bookworm" "python-3.11--slim" 
            "ollama-ollama--latest" "prom-prometheus--latest" 
            "grafana-grafana--latest"
          )
          for pkg in "${packages[@]}"; do
            echo "Setting $pkg to public..."
            curl -s -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/packages/container/$pkg \
              -d '{"visibility":"public"}' || echo "Warning: $pkg may not exist yet"
          done