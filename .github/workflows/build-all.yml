name: NEURO-GENESIS Official Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签 (stable / dev / 6.2-stable)'
        required: false
        default: 'stable'
      build_platform:
        description: '构建平台 (linux/amd64)'
        required: false
        default: 'linux/amd64'
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.vars.outputs.version_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set version tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version_tag=stable" >> $GITHUB_OUTPUT
          else
            echo "version_tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # emotion-engine
      - name: Build & push emotion-engine
        uses: docker/build-push-action@v5
        with:
          context: ./services/emotion
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emotion-engine:${{ steps.vars.outputs.version_tag }}
          platforms: ${{ github.event.inputs.build_platform || 'linux/amd64' }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:emotion-engine,mode=max

      # openclaw
      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          path: openclaw-src
          ref: main

      - name: Build & push OpenClaw
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw-src
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openclaw:${{ steps.vars.outputs.version_tag }}
          build-args: NODE_OPTIONS=--max_old_space_size=4096
          platforms: ${{ github.event.inputs.build_platform || 'linux/amd64' }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/build-cache:openclaw,mode=max

      # base images
      - name: Pull, retag & push base images
        run: |
          images=(
            "node:22-bookworm"
            "python:3.11-slim"
            "ollama/ollama:latest"
            "prom/prometheus:latest"
            "grafana/grafana:latest"
          )
          for img in "${images[@]}"; do
            docker pull "$img"
            safe_name=$(echo "$img" | sed 's/\//-/g;s/:/--/g')
            new_tag="ghcr.io/${{ github.repository_owner }}/$safe_name"
            docker tag "$img" "$new_tag"
            docker push "$new_tag"
          done

      # verify
      - name: Verify core images
        run: |
          TAG="${{ steps.vars.outputs.version_tag }}"
          docker pull ghcr.io/${{ github.repository_owner }}/openclaw:$TAG
          docker pull ghcr.io/${{ github.repository_owner }}/emotion-engine:$TAG
          echo "✅ 核心镜像校验通过"

      # export offline package
      - name: Export all images & create MD5
        run: |
          TAG="${{ steps.vars.outputs.version_tag }}"
          docker save \
            ghcr.io/${{ github.repository_owner }}/openclaw:$TAG \
            ghcr.io/${{ github.repository_owner }}/emotion-engine:$TAG \
            ghcr.io/${{ github.repository_owner }}/ollama-ollama--latest \
            ghcr.io/${{ github.repository_owner }}/node-22--bookworm \
            ghcr.io/${{ github.repository_owner }}/prom-prometheus--latest \
            ghcr.io/${{ github.repository_owner }}/grafana-grafana--latest \
            -o neuro-genesis-full.tar
          gzip neuro-genesis-full.tar
          md5sum neuro-genesis-full.tar.gz > neuro-genesis-full.tar.gz.md5
          gzip -t neuro-genesis-full.tar.gz && echo "✅ 离线包完整性校验通过"

      - name: Upload offline package & MD5 to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.version_tag }}-${{ github.sha }}
          name: "NEURO-GENESIS ${{ steps.vars.outputs.version_tag }} offline bundle"
          files: |
            neuro-genesis-full.tar.gz
            neuro-genesis-full.tar.gz.md5
          draft: false
          prerelease: false